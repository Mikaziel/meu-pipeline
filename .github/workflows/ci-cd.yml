name: CI/CD Pipeline Completo

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/meu-pipeline

jobs:
  unit-tests:
    name: Testes Unitarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests with coverage
        run: |
          pytest tests/test_calculator.py -v \
            --cov=src.calculator \
            --cov-report=term \
            --cov-report=xml:unit-coverage.xml \
            --cov-fail-under=80 \
            -o addopts=""

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: unit-coverage.xml
          retention-days: 7

  integration-tests:
    name: Testes de Integracao
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v \
            --cov=src.database \
            --cov-report=term \
            --cov-report=xml:integration-coverage.xml \
            --cov-fail-under=80 \
            -o addopts=""

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: integration-coverage.xml
          retention-days: 7

  coverage-report:
    name: Relatorio de Cobertura
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run all tests with coverage
        run: |
          pytest -v

      - name: Check coverage threshold
        run: |
          python - << 'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          coverage = float(root.attrib["line-rate"]) * 100

          print(f"Coverage: {coverage:.2f}%")

          if coverage < 80:
              print("Coverage is below 80% threshold")
              sys.exit(1)

          print("Coverage meets threshold")
          PY

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage_html/
          retention-days: 14

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-report
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests, coverage-report ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Prepare Docker tags
        id: meta
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_OUTPUT
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "${{ env.DOCKER_IMAGE }}:${VERSION}" >> $GITHUB_OUTPUT
          fi

          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    name: Criar Release
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests, coverage-report, docker-build ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            Docker Images:
            - ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            - ${{ env.DOCKER_IMAGE }}:latest
            - ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

            Commit SHA: ${{ github.sha }}
          draft: false
          prerelease: false
